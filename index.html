<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I’m Sorry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,400..800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg1:#ffe9f1; --bg2:#ffd6e7; --bg3:#eadcff; --bg4:#d9ecff;
  --ink:#5a2545; --ink-soft:#94607c;
  --card:rgba(255,255,255,.58); --card-edge:rgba(255,255,255,.9); --card-shadow:rgba(214,84,132,.32);
  --accent:#ff5b8d; --accent-2:#b46cff; --accent-soft:rgba(255,91,141,.16); --accent-mid:rgba(255,91,141,.5);
  --btn-from:#ff7fa8; --btn-to:#ff4f86; --btn-ink:#fff; --btn-shadow:rgba(255,79,134,.55);
  --ghost-bg:rgba(255,255,255,.7); --ghost-ink:#a03a68;
  --dot:rgba(90,37,69,.18);
  --stem:#4fbf7e; --leaf:#66d192; --hill-back:#b5ebc6; --hill-front:#8bdca6; --grass:#63c986;
  --spark:#ffffff;
  --glow1:rgba(255,143,177,.55); --glow2:rgba(190,150,255,.5); --glow3:rgba(150,210,255,.5);
  --cat-filter:drop-shadow(0 0 1.2px rgba(120,55,90,.45)) drop-shadow(0 6px 8px rgba(214,84,132,.25));
  --title-glow:rgba(255,91,141,.35);
  --gift-body:#ff7fa6; --gift-lid:#ff5f8f; --gift-ribbon:#ffe58a;
  --paper:#fffdf9; --paper-ink:#5a2545; --tape:rgba(255,229,138,.82);
  --gh:clamp(150px,22vh,210px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg1:#1f1030; --bg2:#33174a; --bg3:#241f5a; --bg4:#142544;
    --ink:#ffe9f3; --ink-soft:#e2b3cb;
    --card:rgba(46,22,66,.55); --card-edge:rgba(255,178,214,.28); --card-shadow:rgba(0,0,0,.55);
    --accent:#ff7fab; --accent-2:#c79bff; --accent-soft:rgba(255,127,171,.2); --accent-mid:rgba(255,127,171,.55);
    --btn-from:#ff86ae; --btn-to:#e8437f; --btn-shadow:rgba(232,67,127,.5);
    --ghost-bg:rgba(255,255,255,.08); --ghost-ink:#ffc2da;
    --dot:rgba(255,232,243,.22);
    --stem:#2e9b6b; --leaf:#3bb27f; --hill-back:#1f6b52; --hill-front:#175a44; --grass:#0f4a38;
    --spark:#ffe9a8;
    --glow1:rgba(255,105,160,.32); --glow2:rgba(150,110,255,.36); --glow3:rgba(90,160,255,.3);
    --cat-filter:drop-shadow(0 0 1.5px rgba(255,210,235,.6)) drop-shadow(0 0 10px rgba(255,150,200,.3));
    --title-glow:rgba(255,127,171,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#1f1030; --bg2:#33174a; --bg3:#241f5a; --bg4:#142544;
  --ink:#ffe9f3; --ink-soft:#e2b3cb;
  --card:rgba(46,22,66,.55); --card-edge:rgba(255,178,214,.28); --card-shadow:rgba(0,0,0,.55);
  --accent:#ff7fab; --accent-2:#c79bff; --accent-soft:rgba(255,127,171,.2); --accent-mid:rgba(255,127,171,.55);
  --btn-from:#ff86ae; --btn-to:#e8437f; --btn-shadow:rgba(232,67,127,.5);
  --ghost-bg:rgba(255,255,255,.08); --ghost-ink:#ffc2da;
  --dot:rgba(255,232,243,.22);
  --stem:#2e9b6b; --leaf:#3bb27f; --hill-back:#1f6b52; --hill-front:#175a44; --grass:#0f4a38;
  --spark:#ffe9a8;
  --glow1:rgba(255,105,160,.32); --glow2:rgba(150,110,255,.36); --glow3:rgba(90,160,255,.3);
  --cat-filter:drop-shadow(0 0 1.5px rgba(255,210,235,.6)) drop-shadow(0 0 10px rgba(255,150,200,.3));
  --title-glow:rgba(255,127,171,.45);
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg1);color:var(--ink);
  font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.fixed-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* ───────── dreamy backdrop ───────── */
.sky{
  z-index:0;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 72%,var(--bg4) 100%);
  background-size:180% 180%;animation:skyShift 26s ease-in-out infinite alternate;
}
@keyframes skyShift{from{background-position:0% 0%}to{background-position:100% 100%}}
.glow{position:fixed;z-index:0;width:56vmax;height:56vmax;border-radius:50%;pointer-events:none;filter:blur(30px)}
.g1{left:-18vmax;top:-16vmax;background:radial-gradient(circle,var(--glow1),transparent 65%);animation:drift1 20s ease-in-out infinite alternate}
.g2{right:-20vmax;top:12vh;background:radial-gradient(circle,var(--glow2),transparent 65%);animation:drift2 24s ease-in-out infinite alternate}
.g3{left:8vw;bottom:-26vmax;background:radial-gradient(circle,var(--glow3),transparent 65%);animation:drift1 28s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-7vmax,8vmax) scale(.92)}}

.sparkles{z-index:0}
.sp{
  position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:var(--spark);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  opacity:0;animation:twinkle var(--d) ease-in-out var(--dl) infinite;
}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(35deg)}}

/* ───────── floating cats ───────── */
.cats{z-index:1}
.cat{
  position:absolute;left:var(--x);bottom:-24vh;
  width:calc(var(--s) * clamp(56px,10vw,100px));
  will-change:transform;animation:rise var(--dur) linear var(--delay) infinite;
}
.cat-inner{animation:bob var(--sway) ease-in-out infinite alternate}
.cat svg,.perch svg{display:block;width:100%;height:auto;filter:var(--cat-filter)}
@keyframes rise{to{transform:translateY(-145vh)}}
@keyframes bob{
  0%{transform:translate(-14px,0) rotate(-7deg)}
  50%{transform:translate(2px,-12px) rotate(3deg)}
  100%{transform:translate(16px,2px) rotate(7deg)}
}
.tail{transform-origin:86px 112px;animation:wag 2.4s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.eyes{transform-origin:60px 54px;animation:blink 5.5s ease-in-out var(--blink,0s) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

/* ───────── garden ───────── */
.garden{position:fixed;left:0;right:0;bottom:0;height:250px;z-index:2;pointer-events:none;overflow:hidden}
.hill,.grass{position:absolute;left:0;width:100%;display:block}
.hill-back{bottom:0;height:120px;fill:var(--hill-back)}
.hill-front{bottom:0;height:78px;fill:var(--hill-front)}
.grass{bottom:0;height:34px;fill:var(--grass)}
.row{position:absolute;left:0;right:0;bottom:0;height:100%}
.plant{
  position:absolute;left:var(--l);bottom:var(--b);width:var(--w);margin-left:calc(var(--w) / -2);
  transform-origin:50% 100%;animation:grow 1.5s cubic-bezier(.34,1.56,.64,1) var(--gd) both;
}
.plant svg{
  display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;
  animation:sway var(--sw) ease-in-out var(--swd) infinite alternate;
}
.stem{fill:none;stroke:var(--stem);stroke-width:4;stroke-linecap:round}
.leaf{fill:var(--leaf)}
@keyframes grow{0%{transform:scale(0) rotate(-6deg)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}

/* ───────── falling petals ───────── */
.petals{z-index:3}
.petal{
  position:absolute;top:0;left:var(--x);width:var(--sz);height:calc(var(--sz) * 1.3);
  background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 55%),var(--pc);
  border-radius:70% 0 70% 0;opacity:.9;will-change:transform;
  animation:fall var(--dur) linear var(--dl) infinite;
}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg)}
  50%{transform:translate3d(var(--drift),55vh,0) rotate(calc(var(--spin) / 2))}
  100%{transform:translate3d(calc(var(--drift) * -.4),112vh,0) rotate(var(--spin))}
}

/* ───────── stage + card ───────── */
.stage{
  position:relative;z-index:4;min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 16px var(--gh);
}
.card{
  position:relative;width:min(100%,640px);margin-top:84px;
  padding:clamp(28px,5vw,46px) clamp(20px,5vw,44px) clamp(24px,4vw,34px);
  border-radius:34px;text-align:center;
  background:var(--card);border:1.5px solid var(--card-edge);
  box-shadow:0 30px 80px -24px var(--card-shadow),inset 0 1px 0 rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
}
.view{display:none}
.view.active{display:block;animation:viewIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* cats sitting on the card */
.perch{
  position:absolute;bottom:calc(100% - 9px);width:clamp(66px,17vw,98px);z-index:3;
  transform-origin:50% 100%;animation:tilt 7s ease-in-out infinite alternate;pointer-events:none;
}
.perch-l{left:15%}
.perch-r{right:15%;animation-delay:-3s}
@keyframes tilt{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}

/* spinning blossoms on the corners */
.corner{
  position:absolute;z-index:4;width:clamp(38px,9vw,54px);pointer-events:none;
  animation:spin 26s linear infinite;filter:drop-shadow(0 4px 6px rgba(214,84,132,.3));
}
.corner svg{display:block;width:100%;height:auto;overflow:visible}
.c-tl{left:-14px;top:-14px}
.c-tr{right:-14px;top:-14px;animation-direction:reverse}
.c-bl{left:-14px;bottom:-14px;animation-direction:reverse}
.c-br{right:-14px;bottom:-14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* intro */
.title{
  margin:0;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-style:italic;font-weight:800;
  font-size:clamp(3.4rem,15vw,6.2rem);line-height:1.02;letter-spacing:-.01em;color:var(--accent);
  text-shadow:0 4px 0 var(--accent-soft),0 14px 32px var(--title-glow);
}
.tw{display:inline-block;white-space:nowrap}
.ch{display:inline-block;animation:chIn .9s cubic-bezier(.3,1.6,.5,1) calc(.55s + var(--i) * 70ms) both}
@keyframes chIn{from{opacity:0;transform:translateY(38px) scale(.5) rotate(-10deg)}to{opacity:1;transform:none}}
.beat{display:block;width:28px;height:28px;margin:14px auto 0;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.sub{margin:10px 0 26px;font-weight:700;font-size:1.05rem;color:var(--ink-soft)}

/* message */
.count{margin:0;font-weight:700;font-size:.9rem;color:var(--ink-soft)}
.dots{display:flex;gap:7px;justify-content:center;margin:10px 0 20px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--dot);transition:width .35s ease,background .35s ease}
.dot.done{background:var(--accent-mid)}
.dot.now{width:26px;background:linear-gradient(90deg,var(--btn-from),var(--btn-to))}
.line-wrap{min-height:calc(1.34em * 4);display:flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,4.6vw,2.2rem)}
.line{
  margin:0;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;
  font-size:1em;line-height:1.34;color:var(--ink);text-wrap:balance;
  transition:opacity .18s ease,transform .18s ease;
}
.line.out{opacity:0;transform:translateY(-8px)}
.w{display:inline-block;animation:wordIn .8s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 80ms + 60ms) both}
@keyframes wordIn{from{opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hl{color:var(--accent);font-weight:700;padding:0 .1em;background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}

/* gift */
.gift-zone{
  max-height:0;opacity:0;visibility:hidden;overflow:hidden;
  transition:max-height .8s cubic-bezier(.2,.8,.2,1),opacity .6s ease .1s,visibility 0s linear .8s;
}
.has-gift .gift-zone{max-height:270px;opacity:1;visibility:visible;margin:6px 0;transition:max-height .8s cubic-bezier(.2,.8,.2,1),opacity .6s ease .1s,visibility 0s}
.gift{display:inline-block;cursor:pointer;border-radius:24px;-webkit-tap-highlight-color:transparent}
.gift.open{cursor:default}
.gift:focus-visible{outline:3px solid var(--accent-2);outline-offset:6px}
.gift svg{display:block;height:clamp(118px,21vh,170px);width:auto;aspect-ratio:200 / 190;overflow:visible}
.gift:not(.open) svg{animation:giftWiggle 2.6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes giftWiggle{0%,55%,100%{transform:rotate(0)}60%{transform:rotate(-6deg)}66%{transform:rotate(6deg)}72%{transform:rotate(-4deg)}78%{transform:rotate(3deg)}84%{transform:rotate(0)}}
.lid{transform-origin:100px 104px;transition:transform .75s cubic-bezier(.3,1.5,.5,1),opacity .5s ease .25s}
.gift.open .lid{transform:translate(-14px,-84px) rotate(-20deg);opacity:0}
.bouquet{transform-box:view-box;transform-origin:100px 118px;transform:scale(0);transition:transform 1s cubic-bezier(.34,1.7,.5,1) .3s}
.gift.open .bouquet{transform:scale(1)}
.bq{transform-origin:100px 118px;animation:bqSway 4.5s ease-in-out infinite alternate}
@keyframes bqSway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.gift-heart{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:50% 50%;transition:opacity .4s ease 1.1s}
.gift.open .gift-heart{opacity:1;animation:heartPulse 1.4s ease-in-out 1.2s infinite}
@keyframes heartPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.gift-cap{margin:2px 0 0;font-weight:700;font-size:.92rem;color:var(--ink-soft)}

/* controls */
.controls{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:22px}
.btn{
  border:0;cursor:pointer;border-radius:999px;font-weight:800;font-size:1rem;line-height:1;
  transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease;-webkit-tap-highlight-color:transparent;
}
.btn:focus-visible,.theme-toggle:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
.btn:active{transform:scale(.96)}
.primary{
  min-height:52px;padding:16px 30px;color:var(--btn-ink);
  background:linear-gradient(135deg,var(--btn-from),var(--btn-to));
  box-shadow:0 12px 26px -8px var(--btn-shadow),inset 0 1px 0 rgba(255,255,255,.4);
}
.primary:hover{transform:translateY(-2px) scale(1.03)}
.primary:active{transform:scale(.97)}
.ghost{width:52px;height:52px;display:grid;place-items:center;background:var(--ghost-bg);color:var(--ghost-ink);border:1.5px solid var(--card-edge)}
.ghost:disabled{opacity:.35;cursor:default}
.ghost svg{width:22px;height:22px}

/* final photo */
.polaroid{
  position:relative;margin:8px auto 0;width:min(80%,300px);padding:12px 12px 0;
  background:var(--paper);color:var(--paper-ink);border-radius:6px;transform:rotate(-2.5deg);
  box-shadow:0 26px 46px -18px rgba(90,37,69,.5),0 1px 0 rgba(0,0,0,.05);
}
.final.active .polaroid{
  animation:polaroidIn 1s cubic-bezier(.3,1.4,.5,1) .25s both,polaroidSway 5s ease-in-out 1.4s infinite alternate;
}
@keyframes polaroidIn{
  from{opacity:0;transform:translateY(-46px) rotate(-14deg) scale(.7)}
  to{opacity:1;transform:rotate(-2.5deg)}
}
@keyframes polaroidSway{from{transform:rotate(-2.5deg)}to{transform:rotate(-.5deg)}}
.polaroid img{display:block;width:100%;height:auto;aspect-ratio:4 / 5;object-fit:cover;border-radius:2px;background:#f3e6ec}
.polaroid figcaption{
  padding:12px 4px 18px;font-family:'Fraunces',Georgia,'Times New Roman',serif;
  font-style:italic;font-weight:600;font-size:clamp(1.5rem,5vw,1.9rem);line-height:1.1;
}
.tape{
  position:absolute;top:-13px;left:50%;width:86px;height:26px;margin-left:-43px;z-index:2;
  background:var(--tape);transform:rotate(3deg);box-shadow:0 2px 4px rgba(0,0,0,.1);
}
.pol-flower{position:absolute;z-index:3;pointer-events:none;animation:spin 32s linear infinite;filter:drop-shadow(0 3px 5px rgba(214,84,132,.35))}
.pol-flower svg{display:block;width:100%;height:auto;overflow:visible}
.pf-a{left:-24px;bottom:34px;width:56px}
.pf-b{right:-20px;top:46px;width:48px;animation-direction:reverse}

/* theme switch */
.theme-toggle{
  position:fixed;z-index:10;right:12px;top:calc(12px + env(safe-area-inset-top,0px));
  width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  background:var(--ghost-bg);color:var(--ghost-ink);border:1.5px solid var(--card-edge);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.theme-toggle .i-sun{display:none}
.theme-toggle[data-mode="dark"] .i-sun{display:block}
.theme-toggle[data-mode="dark"] .i-moon{display:none}

/* particles */
.fx{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.pop{position:absolute;pointer-events:none;will-change:transform,opacity}
.petal-pop{border-radius:60% 0 60% 0}

@media (max-width:520px){
  .card{border-radius:28px}
}
@media (max-height:700px){
  .polaroid{width:min(70%,240px)}
  .gift svg{height:118px}
  .line-wrap{min-height:calc(1.34em * 3.6)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.001ms !important}
  .petals,.sparkles{display:none}
  .cat{bottom:auto;top:var(--top)}
}
</style>
</head>
<body>

<div class="sky fixed-layer" aria-hidden="true"></div>
<div class="glow g1" aria-hidden="true"></div>
<div class="glow g2" aria-hidden="true"></div>
<div class="glow g3" aria-hidden="true"></div>
<div class="sparkles fixed-layer" id="sparkles" aria-hidden="true"></div>
<div class="cats fixed-layer" id="cats" aria-hidden="true"></div>

<div class="garden" aria-hidden="true">
  <svg class="hill hill-back" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 50 C 120 20, 260 70, 420 45 S 720 12, 900 46 S 1120 70, 1200 36 L1200 120 L0 120 Z"/></svg>
  <div class="row" id="rowBack"></div>
  <svg class="hill hill-front" viewBox="0 0 1200 78" preserveAspectRatio="none"><path d="M0 34 C 160 8, 300 52, 520 30 S 860 6, 1040 32 S 1160 44, 1200 26 L1200 78 L0 78 Z"/></svg>
  <div class="row" id="rowFront"></div>
  <svg class="grass" id="grass" viewBox="0 0 1200 34" preserveAspectRatio="none"></svg>
</div>

<div class="petals fixed-layer" id="petals" aria-hidden="true"></div>

<main class="stage">
  <section class="card" id="card">
    <div class="perch perch-l" id="perchL" aria-hidden="true"></div>
    <div class="perch perch-r" id="perchR" aria-hidden="true"></div>
    <div class="corner c-tl" id="cTL" aria-hidden="true"></div>
    <div class="corner c-tr" id="cTR" aria-hidden="true"></div>
    <div class="corner c-bl" id="cBL" aria-hidden="true"></div>
    <div class="corner c-br" id="cBR" aria-hidden="true"></div>

    <div class="view active" id="intro">
      <h1 class="title" id="title" aria-label="I’m Sorry"></h1>
      <span class="beat" id="beat" aria-hidden="true"></span>
      <p class="sub">Please read till the end.</p>
      <div class="controls">
        <button class="btn primary" id="start" type="button">Open my message</button>
      </div>
    </div>

    <div class="view" id="msg">
      <p class="count" id="count">1 of 10</p>
      <div class="dots" id="dots" role="progressbar" aria-label="Message progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"></div>
      <div class="line-wrap"><p class="line" id="line" aria-live="polite"></p></div>

      <div class="gift-zone" id="giftZone">
        <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the gift"></div>
        <p class="gift-cap" id="giftCap">Tap the gift to open it</p>

<script>
(function () {

  var LINES = [

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function heartSVG(c) {
    return '<svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path style="fill:' + c + '" d="' + HEART_PATH + '"/></svg>';
  }
  var HEART_COLORS = ['#ff5b8d', '#ff86ab', '#ffb0c8', '#ff7ac0', '#c58bff', '#ffd166'];
  var PETAL_COLORS = ['#ffb3c9', '#ff8fb1', '#ffd1dc', '#f9a8d4', '#d7b8ff', '#fff0f5', '#ffc9a8'];

  /* ───────── flower heads (100 × 100 units, centred at 50,50) ───────── */
  var HEAD = {
    daisy: function (o) {
      o = o || {}; var petal = o.petal || '#fff', center = o.center || '#ffcf3f', p = '';

    },
    blossom: function (o) {
      o = o || {}; var petal = o.petal || '#ff9fc2', center = o.center || '#ffe27a', p = '';
      for (var i = 0; i < 5; i++) p += '<path d="M50 52 C25 38 27 7 44 7 L50 14 L56 7 C73 7 75 38 50 52 Z" fill="' + petal + '" stroke="rgba(120,40,80,.16)" stroke-width="1" transform="rotate(' + (i * 72) + ' 50 50)"/>';
      p += '<circle cx="50" cy="50" r="8" fill="' + center + '"/>';
      for (var j = 0; j < 6; j++) {
        var a = j * 60 * Math.PI / 180;
        p += '<circle cx="' + (50 + Math.cos(a) * 15).toFixed(1) + '" cy="' + (50 + Math.sin(a) * 15).toFixed(1) + '" r="2.2" fill="' + center + '"/>';
      }
      return p;
    },
    tulip: function (o) {
      o = o || {}; var c1 = o.c1 || '#ff5d8f', c2 = o.c2 || '#ff9ab8';
      return '<path d="M24 30 L38 46 L50 22 L62 46 L76 30 C83 62 71 89 50 89 C29 89 17 62 24 30 Z" fill="' + c1 + '"/>' +
             '<path d="M38 46 L50 22 L62 46 C67 66 60 85 50 89 C40 85 33 66 38 46 Z" fill="' + c2 + '"/>' +
             '<path d="M50 24 C47 44 47 70 50 88" stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" stroke-linecap="round"/>';
    },
    rose: function (o) {
      o = o || {}; var c1 = o.c1 || '#ff7b96', c2 = o.c2 || '#ff5d80', c3 = o.c3 || '#c92f5a', p = '';
      for (var i = 0; i < 6; i++) {
        var a = i * 60 * Math.PI / 180;
        p += '<circle cx="' + (50 + Math.cos(a) * 27).toFixed(1) + '" cy="' + (50 + Math.sin(a) * 27).toFixed(1) + '" r="18" fill="' + c1 + '"/>';
      }
      p += '<circle cx="50" cy="50" r="30" fill="' + c2 + '"/>';
      p += '<path d="M46 50 a4 4 0 1 1 8 0 a9 9 0 1 1 -18 0 a15 15 0 1 1 30 0 a21 21 0 1 1 -42 0" fill="none" stroke="' + c3 + '" stroke-width="3" stroke-linecap="round" opacity=".85"/>';
      return p;
    },
    sun: function () {
      var p = '';
      for (var i = 0; i < 18; i++) p += '<ellipse cx="50" cy="15" rx="6.5" ry="14" fill="#ffb703" transform="rotate(' + (i * 20 + 10) + ' 50 50)"/>';
      for (var k = 0; k < 18; k++) p += '<ellipse cx="50" cy="19" rx="6" ry="13" fill="#ffd23f" stroke="rgba(160,80,0,.18)" stroke-width=".8" transform="rotate(' + (k * 20) + ' 50 50)"/>';
      p += '<circle cx="50" cy="50" r="19" fill="#7a4a2a"/><circle cx="50" cy="50" r="15" fill="#8d5a36"/>';
      for (var n = 0; n < 26; n++) {
        var a = n * 2.399963, r = 2.6 * Math.sqrt(n + 1);

      }
      return p;
    }

  var FLOWERS = [

    ['tulip',   { c1: '#ff5d8f', c2: '#ff9ab8' }],

      HEAD[kind](opts) + '</svg>';
  }

  function buildRow(host, n, cfg) {
    for (var i = 0; i < n; i++) {
      var spec = FLOWERS[(i * 5 + cfg.offset) % FLOWERS.length];
      var k = rand(cfg.k[0], cfg.k[1]);
      var stem = Math.round(rand(cfg.stem[0], cfg.stem[1]));
      var el = document.createElement('div');
      el.className = 'plant';
      el.style.cssText =
        '--l:' + (((i + 0.5) / n) * 100 + rand(-2.5, 2.5)).toFixed(1) + '%;' +
        '--b:' + cfg.b + 'px;--k:' + k.toFixed(2) + ';' +
        '--w:calc(var(--k) * clamp(' + cfg.min + 'px, ' + cfg.vw + 'vw, ' + cfg.max + 'px));' +
        '--gd:' + (0.3 + i * 0.09 + cfg.d).toFixed(2) + 's;' +
        '--sw:' + rand(3.4, 5.8).toFixed(1) + 's;--swd:-' + rand(0, 4).toFixed(1) + 's';
      el.innerHTML = plantSVG(spec[0], spec[1], stem);
      host.appendChild(el);
    }
  }
  buildRow($('#rowBack'),  13, { offset: 1, k: [0.85, 1.15], stem: [70, 120], b: 20, min: 38, vw: 6,   max: 64, d: 0 });

  })();

    { fur: '#f7e3c3', belly: '#fffaf0', ear: '#ffb7c5', stripe: '#d9b98a' }

  function catSVG(c) {
    var eye = c.eye || '#3a2438';
    var pupil = c.pupil ? '<ellipse cx="46" cy="54" rx="2" ry="5" fill="#2b2233"/><ellipse cx="74" cy="54" rx="2" ry="5" fill="#2b2233"/>' : '';

      '<ellipse cx="60" cy="98" rx="30" ry="26" fill="' + c.fur + '"/>' +
      '<ellipse cx="60" cy="105" rx="17" ry="15" fill="' + c.belly + '"/>' +
      '<ellipse cx="45" cy="121" rx="11" ry="6.5" fill="' + c.fur + '"/>' +
      '<ellipse cx="75" cy="121" rx="11" ry="6.5" fill="' + c.fur + '"/>' +
      bodyStripes +
      '<path d="M31 42 L29 13 L54 29 Z" fill="' + c.fur + '" stroke="' + c.fur + '" stroke-width="6" stroke-linejoin="round"/>' +
      '<path d="M89 42 L91 13 L66 29 Z" fill="' + c.fur + '" stroke="' + c.fur + '" stroke-width="6" stroke-linejoin="round"/>' +
      '<path d="M34 35 L33 21 L46 30 Z" fill="' + c.ear + '"/>' +
      '<path d="M86 35 L87 21 L74 30 Z" fill="' + c.ear + '"/>' +
      '<ellipse cx="60" cy="53" rx="35" ry="29" fill="' + c.fur + '"/>' +
      headStripes +
      '<g class="eyes">' +
        '<ellipse cx="46" cy="54" rx="5.5" ry="6.5" fill="' + eye + '"/>' +
        '<ellipse cx="74" cy="54" rx="5.5" ry="6.5" fill="' + eye + '"/>' + pupil +
        '<circle cx="48" cy="51.5" r="2" fill="#fff"/><circle cx="76" cy="51.5" r="2" fill="#fff"/>' +
        '<circle cx="44.5" cy="57" r="1" fill="#fff" opacity=".8"/><circle cx="72.5" cy="57" r="1" fill="#fff" opacity=".8"/>' +
      '</g>' +
      '<ellipse cx="35" cy="65" rx="6" ry="3.5" fill="#ff8fb1" opacity=".55"/>' +
      '<ellipse cx="85" cy="65" rx="6" ry="3.5" fill="#ff8fb1" opacity=".55"/>' +
      '<path d="M56 61 Q60 59 64 61 Q62 66 60 66 Q58 66 56 61Z" fill="#ff7d9c"/>' +
      '<path d="M60 66 Q60 70.5 55 71 M60 66 Q60 70.5 65 71" stroke="#5b3a4d" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
      '<path d="M27 60 L11 56 M27 66 L12 69 M93 60 L109 56 M93 66 L108 69" stroke="#5b3a4d" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>' +
    '</svg>';
  }

  (function floatingCats() {
    var host = $('#cats'), N = 9;
    for (var i = 0; i < N; i++) {
      var s = rand(0.75, 1.3), dur = rand(30, 50);
      var el = document.createElement('div');
      el.className = 'cat';
      el.style.cssText =
        '--x:' + (((i + rand(0.1, 0.8)) / N) * 90).toFixed(1) + '%;' +
        '--s:' + s.toFixed(2) + ';--dur:' + dur.toFixed(1) + 's;' +
        '--delay:-' + (((i * 0.618) % 1) * dur).toFixed(1) + 's;' +
        '--sway:' + rand(4, 7).toFixed(1) + 's;--top:' + rand(8, 72).toFixed(0) + 'vh;' +
        '--blink:-' + rand(0, 5).toFixed(1) + 's';
      el.innerHTML = '<div class="cat-inner">' + catSVG(CATS[i % CATS.length]) + '</div>';
      host.appendChild(el);
    }
  })();

  $('#perchL').innerHTML = catSVG(CATS[1]);
  $('#perchR').innerHTML = catSVG(CATS[0]);
  $('#perchR').style.setProperty('--blink', '-2.2s');

  [['#cTL', 2], ['#cTR', 0], ['#cBL', 7], ['#cBR', 5], ['#pfA', 4], ['#pfB', 10]].forEach(function (c) {
    var f = FLOWERS[c[1]];
    $(c[0]).innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' + HEAD[f[0]](f[1]) + '</svg>';
  });

  /* ───────── ambient: sparkles + falling petals ───────── */
  (function ambient() {
    var sp = $('#sparkles');
    for (var i = 0; i < 30; i++) {
      var s = document.createElement('i');
      s.className = 'sp';
      s.style.cssText = '--x:' + rand(0, 100).toFixed(1) + '%;--y:' + rand(0, 82).toFixed(1) + '%;--s:' + rand(6, 15).toFixed(0) + 'px;--d:' + rand(2.6, 5.4).toFixed(1) + 's;--dl:' + rand(0, 5).toFixed(1) + 's';
      sp.appendChild(s);
    }
    var pt = $('#petals'), n = window.innerWidth < 600 ? 16 : 28;
    for (var j = 0; j < n; j++) {
      var p = document.createElement('i');
      p.className = 'petal';
      p.style.cssText =
        '--x:' + rand(0, 100).toFixed(1) + '%;--sz:' + rand(9, 17).toFixed(0) + 'px;--pc:' + pick(PETAL_COLORS) + ';' +
        '--dur:' + rand(11, 20).toFixed(1) + 's;--dl:-' + rand(0, 20).toFixed(1) + 's;' +
        '--drift:' + rand(-90, 90).toFixed(0) + 'px;--spin:' + rand(360, 900).toFixed(0) + 'deg';
      pt.appendChild(p);
    }
  })();

  /* ───────── particles ───────── */
  var fx = $('#fx');
  function burst(x, y, n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('span');
      el.className = 'pop';
      var size = rand(10, 24);
      el.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + x + 'px;top:' + y + 'px';
      if (Math.random() < 0.5) {
        el.innerHTML = heartSVG(pick(HEART_COLORS));
      } else {
        el.className += ' petal-pop';
        el.style.background = pick(PETAL_COLORS);
      }
      fx.appendChild(el);
      var ang = rand(-Math.PI * 0.95, -Math.PI * 0.05), dist = rand(90, 300);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = rand(-360, 360);
      var a = el.animate([
        { transform: 'translate(-50%,-50%) translate(0px,0px) scale(.2) rotate(0deg)', opacity: 1 },
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(' + (rot * 0.5) + 'deg)', opacity: 1, offset: 0.45 },
        { transform: 'translate(-50%,-50%) translate(' + (dx * 1.15) + 'px,' + (dy + 260) + 'px) scale(.7) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: rand(1300, 2300), easing: 'cubic-bezier(.22,.7,.3,1)', fill: 'forwards' });
      a.onfinish = (function (node) { return function () { node.remove(); }; })(el);
    }
  }

  function heartRise(n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('span');
      el.className = 'pop';
      var size = rand(14, 30);
      el.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + rand(3, 97) + 'vw;top:105vh';
      el.innerHTML = heartSVG(pick(HEART_COLORS));
      fx.appendChild(el);
      var drift = rand(-60, 60);
      var a = el.animate([
        { transform: 'translate(-50%,0) translate(0px,0px) scale(.6) rotate(0deg)', opacity: 0 },
        { opacity: 1, offset: 0.15 },
        { transform: 'translate(-50%,0) translate(' + drift + 'px,-115vh) scale(1.1) rotate(' + rand(-30, 30) + 'deg)', opacity: 0 }
      ], { duration: rand(3500, 6500), delay: rand(0, 1800), easing: 'ease-out', fill: 'both' });
      a.onfinish = (function (node) { return function () { node.remove(); }; })(el);
    }
  }

  function floatHeart(x, y) {
    if (reduce) return;
    var el = document.createElement('span');
    el.className = 'pop';
    var s = rand(12, 18), drift = rand(-14, 14);
    el.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + x + 'px;top:' + y + 'px';
    el.innerHTML = heartSVG(pick(HEART_COLORS));
    fx.appendChild(el);
    var a = el.animate([
      { transform: 'translate(-50%,-50%) translate(0px,0px) scale(.4)', opacity: 0 },
      { transform: 'translate(-50%,-50%) translate(' + (drift * 0.5) + 'px,-40px) scale(1)', opacity: 1, offset: 0.25 },
      { transform: 'translate(-50%,-50%) translate(' + drift + 'px,-90px) scale(.9)', opacity: 0 }
    ], { duration: 2600, easing: 'ease-out' });
    a.onfinish = function () { el.remove(); };
  }
  setInterval(function () {
    if (document.hidden) return;
    var r = $('#perchR').getBoundingClientRect();
    floatHeart(r.left + r.width * 0.62, r.top + r.height * 0.08);
  }, 3400);

  /* ───────── intro title ───────── */
  (function title() {
    var host = $('#title'), idx = 0;
    ['I’m', 'Sorry'].forEach(function (word, wi, arr) {
      var w = document.createElement('span');
      w.className = 'tw';
      w.setAttribute('aria-hidden', 'true');
      Array.from(word).forEach(function (ch) {
        var s = document.createElement('span');
        s.className = 'ch';
        s.style.setProperty('--i', idx++);
        s.textContent = ch;
        w.appendChild(s);
      });
      host.appendChild(w);
      if (wi < arr.length - 1) host.appendChild(document.createTextNode(' '));
    });
    $('#beat').innerHTML = heartSVG('var(--accent)');
  })();

  /* ───────── gift ───────── */
  (function buildGift() {
    function head(kind, opts, x, y, s) {
      return '<g transform="translate(' + (x - 50 * s).toFixed(1) + ' ' + (y - 50 * s).toFixed(1) + ') scale(' + s + ')">' + HEAD[kind](opts) + '</g>';
    }
    function stem(x, y) {
      return '<path class="stem" style="stroke-width:3" d="M100 122 Q ' + (100 + (x - 100) * 0.35) + ' ' + ((122 + y) / 2 + 8) + ' ' + x + ' ' + (y + 16) + '"/>';
    }
    var rib = 'style="fill:var(--gift-ribbon)" stroke="rgba(190,130,20,.45)" stroke-width="1.5"';
    $('#gift').innerHTML =
      '<svg viewBox="0 0 200 190" aria-hidden="true">' +
        '<ellipse cx="100" cy="184" rx="58" ry="6" fill="rgba(60,20,50,.16)"/>' +
        '<g class="bouquet"><g class="bq">' +
          stem(100, 46) + stem(60, 66) + stem(140, 66) + stem(78, 88) + stem(122, 88) +
          '<path class="leaf" d="M100 120 C 78 108, 66 112, 62 118 C 76 128, 92 126, 100 120Z"/>' +
          '<path class="leaf" d="M100 120 C 122 108, 134 112, 138 118 C 124 128, 108 126, 100 120Z"/>' +
          head('blossom', { petal: '#ff9fc2', center: '#ffe27a' }, 60, 64, 0.5) +
          head('daisy',   { petal: '#ffffff', center: '#ffcf3f' }, 140, 64, 0.5) +
          head('tulip',   { c1: '#a879ff', c2: '#cdb0ff' }, 78, 90, 0.42) +
          head('blossom', { petal: '#ffc9a8', center: '#ffffff' }, 122, 90, 0.42) +
          head('rose',    {}, 100, 46, 0.56) +
        '</g></g>' +
        '<g class="box">' +
          '<rect x="52" y="112" width="96" height="68" rx="8" style="fill:var(--gift-body)"/>' +
          '<rect x="58" y="120" width="6" height="52" rx="3" fill="rgba(255,255,255,.28)"/>' +
          '<rect x="93" y="112" width="14" height="68" style="fill:var(--gift-ribbon)"/>' +
        '</g>' +
        '<g class="lid">' +
          '<rect x="44" y="92" width="112" height="24" rx="8" style="fill:var(--gift-lid)"/>' +
          '<rect x="52" y="97" width="30" height="5" rx="2.5" fill="rgba(255,255,255,.35)"/>' +
          '<rect x="93" y="92" width="14" height="24" style="fill:var(--gift-ribbon)"/>' +
          '<path d="M100 92 C 82 62, 56 66, 64 86 C 68 96, 90 94, 100 92 Z" ' + rib + '/>' +
          '<path d="M100 92 C 118 62, 144 66, 136 86 C 132 96, 110 94, 100 92 Z" ' + rib + '/>' +
          '<ellipse cx="100" cy="92" rx="9" ry="8" ' + rib + '/>' +
        '</g>' +
        '<g transform="translate(94 4) scale(.5)"><path class="gift-heart" d="' + HEART_PATH + '"/></g>' +
      '</svg>';
  })();

  /* ───────── flow ───────── */
  var card = $('#card'), introV = $('#intro'), msgV = $('#msg'), finalV = $('#final');
  var FINAL = LINES.length;
  var lineEl = $('#line'), countEl = $('#count'), dotsEl = $('#dots');
  var prevBtn = $('#prev'), nextBtn = $('#next'), nextLabel = $('#nextLabel');
  var gift = $('#gift'), giftCap = $('#giftCap');
  var step = -1, giftOpen = false, token = 0;

  var dots = LINES.map(function () {
    var d = document.createElement('i');
    d.className = 'dot';
    dotsEl.appendChild(d);
    return d;
  });

  var HL = /sorry|forgive|gift|heart|care|matter/i;
  function buildLine(text) {
    lineEl.innerHTML = '';
    var words = text.split(' ');
    words.forEach(function (w, i) {
      var span = document.createElement('span');
      span.className = 'w' + (HL.test(w) ? ' hl' : '');
      span.style.setProperty('--i', i);
      span.textContent = w;
      lineEl.appendChild(span);
      if (i < words.length - 1) lineEl.appendChild(document.createTextNode(' '));
    });
  }

  function syncControls() {
    var last = step === LINES.length - 1;
    var needGift = step === GIFT_STEP && !giftOpen;
    nextLabel.textContent = last ? 'One last thing' : (needGift ? 'Open the gift' : 'Next');
    giftCap.textContent = giftOpen ? 'A little bouquet, just for you' : 'Tap the gift to open it';
  }

  function celebrate() {
    heartRise(30);
    var r = $('#polaroid').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.45, 42);
  }

  function render() {
    var total = LINES.length;
    dots.forEach(function (d, k) {
      d.classList.toggle('done', k < step);
      d.classList.toggle('now', k === step);
    });
    dotsEl.setAttribute('aria-valuenow', step + 1);
    countEl.textContent = (step + 1) + ' of ' + total;
    prevBtn.disabled = step <= 0;
    card.classList.toggle('has-gift', step >= GIFT_STEP);
    syncControls();

    var t = ++token;
    var swap = function () {
      if (t !== token) return;
      buildLine(LINES[step]);
      lineEl.classList.remove('out');
    };
    if (lineEl.firstChild) { lineEl.classList.add('out'); setTimeout(swap, 190); } else { swap(); }
  }

  function openGift() {
    if (giftOpen) return;
    giftOpen = true;
    gift.classList.add('open');
    gift.setAttribute('aria-label', 'Gift opened');
    syncControls();
    setTimeout(function () {
      var r = gift.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height * 0.55, 48);
    }, 250);
  }

  function showFinal() {
    step = FINAL;
    var t = ++token;
    msgV.classList.remove('active');
    finalV.classList.add('active');
    setTimeout(function () { if (t === token) celebrate(); }, 750);
  }
  function hideFinal() {
    ++token;
    step = LINES.length - 1;
    finalV.classList.remove('active');
    msgV.classList.add('active');
    render();
  }

  function next() {
    if (step < 0 || step === FINAL) return;
    if (step === GIFT_STEP && !giftOpen) { openGift(); return; }
    if (step === LINES.length - 1) { showFinal(); return; }
    step++; render();
  }
  function prev() {
    if (step === FINAL) { hideFinal(); return; }
    if (step > 0) { step--; render(); }
  }
  function restart() {
    ++token;
    giftOpen = false;
    gift.classList.remove('open');
    gift.setAttribute('aria-label', 'Open the gift');
    finalV.classList.remove('active');
    msgV.classList.add('active');
    lineEl.innerHTML = '';
    step = 0; render();
  }

  $('#start').addEventListener('click', function (e) {
    var r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 22);
    step = 0;
    introV.classList.remove('active');
    msgV.classList.add('active');
    render();
  });
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  $('#prev2').addEventListener('click', prev);
  $('#again').addEventListener('click', restart);
  gift.addEventListener('click', openGift);
  gift.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
  });

  var sx = null, sy = null;
  card.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY;
  }, { passive: true });
  card.addEventListener('touchend', function (e) {
    if (sx === null || step < 0) { sx = sy = null; return; }
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = sy = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { if (dx < 0) next(); else prev(); }
  }, { passive: true });

  /* ───────── day / night ───────── */
  var root = document.documentElement, themeBtn = $('#theme');
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : mq.matches; }
  function syncTheme() {
    var d = isDark();
    themeBtn.dataset.mode = d ? 'dark' : 'light';
    themeBtn.setAttribute('aria-label', d ? 'Switch to day mode' : 'Switch to night mode');
  }
  themeBtn.addEventListener('click', function () {
    root.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    syncTheme();
  });
  if (mq.addEventListener) mq.addEventListener('change', syncTheme);
  new MutationObserver(syncTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  syncTheme();
})();
</script>
</body>
</html>
